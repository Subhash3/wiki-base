[project]
name = "document-processing"
version = "0.1.0"
description = "Reusable document parsing and chunking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling[rapidocr]>=2",
    "transformers>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_processing"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
