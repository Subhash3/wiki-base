[project]
name = "graph-rag"
version = "0.1.0"
description = "Graph-based retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "document-processing",
    "llm-providers",
    "networkx>=3.4",
    "pyvis>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
